<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории — Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">Кухни мира • Admin</div>
            <ul class="sidebar-nav">
                <li><a href="recipes.html">Рецепты</a></li>
                <li><a href="categories.html" class="active">Категории</a></li>
                <li><a href="ingredients.html">Ингредиенты</a></li>
                <li><a href="orders.html">Заказы</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="login.html" class="btn btn-outline btn-sm" style="width: 100%; text-align: center;">Выйти</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Категории рецептов</h1>
            </div>

            <div class="grid-2">
                <!-- Форма создания/редактирования -->
                <div class="card" style="align-self: start;">
                    <h3 style="margin-bottom: 14px; font-size: 16px;">Добавить / Редактировать категорию</h3>
                    <form>
                        <div class="form-group">
                            <label>Название категории * (уникальное, макс. 40 символов)</label>
                            <input type="text" maxlength="40" class="form-control" placeholder="Например: Национальные напитки" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </form>
                </div>

                <!-- Таблица категорий -->
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Рецептов</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Первые блюда</td>
                                <td>4</td>
                                <td>
                                    <button class="btn btn-primary btn-sm">Редактировать</button>
                                    <!-- Запрет удаления если есть рецепты -->
                                    <button class="btn btn-outline btn-sm" disabled title="Нельзя удалить категорию с рецептами">Удалить</button>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Десерты</td>
                                <td>0</td>
                                <td>
                                    <button class="btn btn-primary btn-sm">Редактировать</button>
                                    <button class="btn btn-danger btn-sm">Удалить</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
