<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ингредиенты — Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">Кухни мира • Admin</div>
            <ul class="sidebar-nav">
                <li><a href="recipes.html">Рецепты</a></li>
                <li><a href="categories.html">Категории</a></li>
                <li><a href="ingredients.html" class="active">Ингредиенты</a></li>
                <li><a href="orders.html">Заказы</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="login.html" class="btn btn-outline btn-sm" style="width: 100%; text-align: center;">Выйти</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Справочник ингредиентов</h1>
            </div>

            <div class="grid-2">
                <!-- Форма создания/редактирования ингредиента -->
                <div class="card" style="align-self: start;">
                    <h3 style="margin-bottom: 14px; font-size: 16px;">Добавить / Редактировать ингредиент</h3>
                    <form>
                        <div class="form-group">
                            <label>Название ингредиента * (уникальное, макс. 20 символов)</label>
                            <input type="text" maxlength="20" class="form-control" placeholder="Например: Свекла" required>
                        </div>

                        <div class="form-group">
                            <label>Единица измерения *</label>
                            <select class="form-control" required>
                                <option value="шт">шт</option>
                                <option value="л">л</option>
                                <option value="кг">кг</option>
                                <option value="мг">мг</option>
                                <option value="ст.л.">ст.л.</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </form>
                </div>

                <!-- Список ингредиентов -->
                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Ед. изм.</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Свекла</td>
                                <td>шт</td>
                                <td>
                                    <button class="btn btn-primary btn-sm">Редактировать</button>
                                    <button class="btn btn-danger btn-sm">Удалить</button>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Мука пшеничная</td>
                                <td>кг</td>
                                <td>
                                    <button class="btn btn-primary btn-sm">Редактировать</button>
                                    <button class="btn btn-danger btn-sm">Удалить</button>
                                </td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Масло растительное</td>
                                <td>ст.л.</td>
                                <td>
                                    <button class="btn btn-primary btn-sm">Редактировать</button>
                                    <button class="btn btn-danger btn-sm">Удалить</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
